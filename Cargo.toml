[workspace]
members = ["mcumgr-transport-ethernet", "mcumgrctl-eth"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshium/mcumgr-transport-ethernet"
keywords = ["zephyr", "mcumgr", "smp", "ethernet"]

[workspace.dependencies]
mcumgr-toolkit = "0.18.0"
mcumgrctl = { version = "0.18.0", default-features = false }

mcumgr-transport-ethernet = { path = "mcumgr-transport-ethernet" }

clap = { version = "4.6.0", features = ["derive"] }
miette = "7.6.0"
thiserror = "2.0.20"
log = "0.4.34"
socket2 = { version = "0.6.5", features = ["all"] }
libc = "0.2.189"
proptest = "1.11.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
